<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Order</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">Main</a>
      <a href="/page2.html">About tour</a>
      <a href="/page3.html">Vacantion</a>
      <a href="/page4.html" aria-current="page">Order</a>
    </nav>
    <main>
      <h1 class="p2-h1">Order your tour:</h1>

      <form
        style="
          margin: 2rem;
          background-color: rgba(255, 255, 255, 0.7);
          padding: 20px;
          border-radius: 15px;
        "
      >
        <h3 class="p2-h3">Personal Information:</h3>
        <p class="p2-p">
          <input
            type="text"
            placeholder="Your Name"
            style="
              padding: 10px;
              font-size: 1.2rem;
              border-radius: 5px;
              margin-bottom: 10px;
              width: 250px;
            "
          />
        </p>
        <p class="p2-p">
          <input
            type="email"
            placeholder="Your Email"
            style="
              padding: 10px;
              font-size: 1.2rem;
              border-radius: 5px;
              margin-bottom: 10px;
              width: 250px;
            "
          />
        </p>

        <h3 class="p2-h3">Tour Details:</h3>
        <div class="p2-p">
          <select
            name="mountain"
            style="
              padding: 10px;
              font-size: 1.2rem;
              border-radius: 5px;
              margin-bottom: 10px;
              width: 250px;
            "
          >
            <option value="kilimanjaro">Mount Kilimanjaro</option>
            <option value="fuji">Mount Fuji</option>
            <option value="hoverla">Mount Hoverla</option>
          </select>
        </div>

        <div class="p2-p">
          <input
            type="number"
            placeholder="Number of people"
            min="1"
            max="10"
            style="
              padding: 10px;
              font-size: 1.2rem;
              border-radius: 5px;
              width: 250px;
            "
          />
        </div>

        <br />
        <div style="display: flex; justify-content: center">
          <a
            href="#"
            class="m-btn"
            onclick="alert('Thank you! Your order has been submitted.')"
            >Submit Order</a
          >
        </div>
        <br /><br /><br />
      </form>
    </main>
  </body>
</html>
